<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Automated B2B Purchase Order Workflow</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg:#0A0F1C;
    --surface:#111A2E;
    --surface-2:#16233D;
    --line:#233252;
    --teal:#4FE0C8;
    --teal-dim:#1F6E63;
    --amber:#FFB454;
    --text:#EAF2FF;
    --muted:#8CA0C4;
    --success:#3EE08A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);overflow:hidden;}

  .stage{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:10px 6vw 6px;
  }

  /* subtle grid backdrop */
  .stage::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:48px 48px;
    opacity:.18;
    pointer-events:none;
  }
  .stage::after{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(ellipse 60% 40% at 50% 0%, rgba(79,224,200,0.10), transparent 70%);
    pointer-events:none;
  }

  .eyebrow{
    position:relative;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:.18em;
    color:var(--teal);
    text-transform:uppercase;
    margin-bottom:2px;
    z-index:2;
  }
  h1.title{
    position:relative;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:21px;
    margin:0 0 8px;
    letter-spacing:-0.01em;
    z-index:2;
    text-align:center;
    line-height:1.25;
  }

  /* ---------- PIPELINE ---------- */
  .pipeline{
    position:relative;
    width:min(1180px,92vw);
    z-index:2;
    margin-bottom:2px;
  }
  .pipeline svg{width:100%;display:block;overflow:visible;}
  .track{fill:none; stroke:var(--line); stroke-width:2;}
  .track-fill{fill:none; stroke:var(--teal); stroke-width:2; stroke-dasharray:2000; stroke-dashoffset:2000; filter:drop-shadow(0 0 6px rgba(79,224,200,.7)); transition:stroke-dashoffset 1.1s cubic-bezier(.65,0,.35,1);}
  .node{transition:all .4s ease;}
  .node circle.ring{fill:var(--bg); stroke:var(--line); stroke-width:2; transition:all .4s ease;}
  .node.active circle.ring{stroke:var(--teal); filter:drop-shadow(0 0 10px rgba(79,224,200,.65));}
  .node.done circle.ring{stroke:var(--success); fill:var(--bg);}
  .node.branch-fail.active circle.ring{stroke:var(--amber); filter:drop-shadow(0 0 10px rgba(255,180,84,.65));}
  .node text.num{font-family:'JetBrains Mono',monospace; font-size:13px; fill:var(--muted); text-anchor:middle; dominant-baseline:central;}
  .node.active text.num,.node.done text.num{fill:var(--text); font-weight:600;}
  .node text.label{font-family:'Inter',sans-serif; font-size:11.5px; fill:var(--muted); text-anchor:middle;}
  .node.active text.label{fill:var(--teal); font-weight:600;}
  .node.done text.label{fill:var(--success);}
  .node.branch-fail.active text.label{fill:var(--amber);}
  .prog-arc{fill:none; stroke:var(--teal); stroke-width:3; stroke-linecap:round; opacity:0;
    transition:stroke-dashoffset .55s cubic-bezier(.65,0,.35,1), opacity .3s ease, stroke .4s ease;}
  .node.branch-fail .prog-arc{stroke:var(--amber); filter:drop-shadow(0 0 6px rgba(255,180,84,.7));}
  .node.active .prog-arc{filter:drop-shadow(0 0 5px rgba(79,224,200,.6));}
  .particle{fill:var(--teal); filter:drop-shadow(0 0 4px rgba(79,224,200,.9)); opacity:0;}

  /* ---------- CONTENT ---------- */
  .content-wrap{
    position:relative;
    flex:1;
    width:min(1120px,95vw);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
    min-height:0;
  }
  .slide{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    opacity:0;
    transform:translateY(16px);
    transition:opacity .5s ease, transform .5s ease;
    pointer-events:none;
    text-align:center;
    padding:2px 10px;
    overflow:hidden;
    min-height:0;
  }
  .slide.show{opacity:1; transform:translateY(0); pointer-events:auto;}

  .tag{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--teal); background:rgba(79,224,200,.08);
    border:1px solid rgba(79,224,200,.35);
    padding:6px 14px; border-radius:99px;
    margin-bottom:14px;
  }
  .tag.amber{color:var(--amber); background:rgba(255,180,84,.08); border-color:rgba(255,180,84,.35);}
  .tag.green{color:var(--success); background:rgba(62,224,138,.08); border-color:rgba(62,224,138,.35);}

  .slide h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(26px,4.2vw,42px);
    font-weight:700;
    margin:0 0 14px;
    letter-spacing:-0.01em;
    max-width:900px;
    line-height:1.15;
  }
  .slide p.desc{
    font-size:clamp(15px,1.6vw,19px);
    line-height:1.55;
    color:var(--muted);
    max-width:760px;
    margin:0 0 18px;
  }

  .chips{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:900px; margin-top:10px;}
  .chip{
    font-size:16px; font-family:'JetBrains Mono',monospace;
    color:var(--text); background:var(--surface-2);
    border:1px solid var(--line); border-radius:10px;
    padding:12px 20px;
  }

  .flow-mini{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; max-width:960px; margin-top:12px;}
  .flow-mini .step{
    font-size:18px; font-family:'Inter',sans-serif; font-weight:500;
    background:var(--surface-2); border:1px solid var(--line);
    padding:14px 22px; border-radius:11px; color:var(--text);
  }
  .flow-mini .arrow{color:var(--teal); font-size:22px; font-weight:600;}

  .shot-frame{
    margin-top:6px;
    border:1px solid var(--line);
    border-radius:12px;
    padding:6px;
    background:var(--surface);
    box-shadow:0 20px 50px -20px rgba(0,0,0,.6);
    max-height:48vh;
    flex-shrink:1;
  }
  .shot-frame img,
  .shot-frame svg{display:block; max-height:44vh; width:auto; max-width:90vw; border-radius:6px; cursor:zoom-in; transition:opacity .15s;}
  .shot-frame img:hover,
  .shot-frame svg:hover{opacity:.88;}
  .shot-frame.flow-frame{max-height:60vh;}
  .shot-frame.flow-frame img{max-height:56vh;}

  /* Image-heavy slides — give the screenshot maximum real estate */
  .has-img{justify-content:flex-start; padding-top:6px;}
  .has-img .tag{margin-bottom:8px; flex:none; font-size:11px; padding:4px 12px;}
  .has-img h2{font-size:clamp(18px,2.2vw,26px); margin:0 0 6px; flex:none;}
  .has-img p.desc{font-size:clamp(13px,1.3vw,15px); line-height:1.4; margin:0 0 8px; flex:none; max-width:820px;}
  .has-img .shot-frame{
    flex:1 1 auto;
    min-height:0;
    max-height:none;
    margin-top:0;
    display:flex; align-items:center; justify-content:center;
    width:100%; box-sizing:border-box;
    padding:8px;
  }
  .has-img .shot-frame img,
  .has-img .shot-frame svg{
    max-height:100%; max-width:100%;
    width:auto; height:auto;
    object-fit:contain;
  }
  .has-img .shot-frame svg{width:100%; height:100%;}

  /* ---------- LIGHTBOX ---------- */
  #lb-overlay{
    display:none;
    position:fixed; inset:0; z-index:9999;
    background:rgba(0,0,0,.94);
    cursor:zoom-out;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    overflow:auto;
    scrollbar-width:thin;
    scrollbar-color:rgba(255,255,255,.3) transparent;
  }
  #lb-overlay::-webkit-scrollbar{width:10px; height:10px;}
  #lb-overlay::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25); border-radius:5px;}
  #lb-overlay::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.45);}
  #lb-overlay.open{display:block;}
  #lb-stage{
    min-height:100%;
    display:flex; align-items:flex-start; justify-content:center;
    padding:40px 20px;
    box-sizing:border-box;
  }
  #lb-img{
    display:block;
    max-width:96vw;
    max-height:calc(100vh - 80px);
    width:auto; height:auto;
    object-fit:contain;
    border-radius:10px;
    box-shadow:0 30px 80px -20px rgba(0,0,0,.8);
    transform:scale(.96); opacity:0;
    transition:transform .22s cubic-bezier(.34,1.56,.64,1), opacity .18s ease, max-width .25s ease, max-height .25s ease;
    cursor:zoom-in;
    user-select:none;
  }
  #lb-overlay.open #lb-img{transform:scale(1); opacity:1;}
  #lb-overlay.zoomed{cursor:auto;}
  #lb-overlay.zoomed #lb-img{
    max-width:none;
    max-height:none;
    width:150vw;
    height:auto;
    cursor:zoom-out;
  }
  #lb-close{
    position:fixed; top:18px; right:22px;
    width:40px; height:40px; border-radius:50%;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2);
    color:#fff; font-size:22px; line-height:40px; text-align:center;
    cursor:pointer; transition:background .15s; user-select:none;
    z-index:10001;
  }
  #lb-close:hover{background:rgba(255,255,255,.22);}
  #lb-zoom{
    position:fixed; top:18px; right:72px;
    height:40px; padding:0 16px; border-radius:20px;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2);
    color:#fff; font-size:13px; font-family:'JetBrains Mono',monospace;
    line-height:40px; cursor:pointer; transition:background .15s; user-select:none;
    z-index:10001;
  }
  #lb-zoom:hover{background:rgba(255,255,255,.22);}
  #lb-hint{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    font-family:'JetBrains Mono',monospace; font-size:11px;
    color:rgba(255,255,255,.55); letter-spacing:.1em; pointer-events:none;
    z-index:10001;
    background:rgba(0,0,0,.4); padding:6px 14px; border-radius:99px;
    border:1px solid rgba(255,255,255,.1);
  }

  .outcome-card{
    display:flex; gap:16px; align-items:flex-start;
    background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:22px 28px; max-width:780px; text-align:left;
    margin-top:10px;
  }
  .outcome-card.amber{border-color:rgba(255,180,84,.35);}
  .outcome-card .dot{width:11px;height:11px;border-radius:50%;background:var(--success);margin-top:8px;flex:none;}
  .outcome-card.amber .dot{background:var(--amber);}
  .outcome-card ul{margin:0; padding-left:20px; color:var(--text); font-size:16px; line-height:1.75;}

  /* ---------- CONTROLS ---------- */
  .controls{
    position:relative; z-index:2;
    display:flex; align-items:center; gap:14px;
    width:min(760px,92vw);
    margin-top:8px;
    flex-shrink:0;
  }
  .ctrl-btn{
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:all .2s; flex:none;
  }
  .ctrl-btn:hover{border-color:var(--teal); color:var(--teal);}
  .ctrl-btn svg{width:14px;height:14px;}

  .bars{display:none;}
  .bar-wrap{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;}
  .bar-emoji{font-size:16px; line-height:1; opacity:.45; transition:opacity .2s, transform .2s, filter .2s;}
  .bar-wrap:hover .bar-emoji{opacity:1; transform:translateY(-1px);}
  .bar-wrap.current .bar-emoji{opacity:1; transform:scale(1.15); filter:drop-shadow(0 0 6px rgba(79,224,200,.7));}
  .bar-wrap.past .bar-emoji{opacity:.85;}
  .bar{width:100%; height:8px; background:var(--line); border-radius:99px; overflow:hidden; transition:height .15s, opacity .15s;}
  .bar-wrap:hover .bar{height:11px;}
  .bar > span{display:block; height:100%; width:0%; background:var(--teal); border-radius:99px;}
  .bar-wrap.past .bar > span{width:100%; background:var(--success);}

  .counter{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--muted); flex:none; width:46px; text-align:right; font-weight:500;}
</style>
</head>
<body>

<!-- Lightbox -->
<div id="lb-overlay">
  <div id="lb-zoom" title="Toggle 150% zoom">Zoom 150%</div>
  <div id="lb-close" title="Close">&#x2715;</div>
  <div id="lb-stage"><img id="lb-img" src="" alt=""/></div>
  <div id="lb-hint">Click image to zoom • scroll to pan • ESC to close</div>
</div>

<div class="stage">
  <h1 class="title">
    <span style="font-size:1.3em;vertical-align:middle;margin-right:16px;filter:drop-shadow(0 0 10px rgba(79,224,200,.5));">🤖</span>
    Agentic Workflow for B2B Purchase Order
    <span style="font-size:1.3em;vertical-align:middle;margin-left:16px;filter:drop-shadow(0 0 10px rgba(79,224,200,.5));">🤖</span>
  </h1>

  <div class="pipeline">
    <svg viewBox="0 0 1180 105" preserveAspectRatio="xMidYMid meet">
      <path id="trackPath" class="track" d="M40,45 L1140,45"/>
      <path id="trackFill" class="track-fill" d="M40,45 L1140,45"/>
      <circle id="particle" class="particle" r="4" cx="40" cy="45"/>
      <!-- nodes placed by JS -->
      <g id="nodesGroup"></g>
    </svg>
  </div>

  <div class="content-wrap" id="contentWrap"></div>

  <div class="controls">
    <div class="ctrl-btn" id="prevBtn" title="Previous">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </div>
    <div class="ctrl-btn" id="playBtn" title="Play/Pause">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
      <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="5" y="3" width="5" height="18" rx="1"></rect><rect x="14" y="3" width="5" height="18" rx="1"></rect></svg>
    </div>
    <div class="bars" id="bars"></div>
    <div class="ctrl-btn" id="nextBtn" title="Next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </div>
    <div class="counter" id="counter">1/7</div>
  </div>
</div>

          <!-- left: pass -->
          <rect class="b-green-l" x="60" y="320" width="160" height="40" rx="8"/>
          <text class="fc-txt b-green-l-t" x="140" y="340">Pass</text>

          <!-- right: amber branch -->
          <rect class="b-amber-l" x="320" y="320" width="200" height="40" rx="8"/>
          <text class="fc-txt b-amber-l-t" x="420" y="340">Approval Required</text>
          <line class="l-amber" x1="420" y1="360" x2="420" y2="378" marker-end="url(#arr-a)"/>

          <rect class="b-amber-l" x="320" y="380" width="200" height="40" rx="8"/>
          <text class="fc-txt b-amber-l-t" x="420" y="400">Manager Review</text>
          <line class="l-amber" x1="420" y1="420" x2="420" y2="438" marker-end="url(#arr-a)"/>

          <rect class="b-amber-l" x="320" y="440" width="200" height="40" rx="8"/>
          <text class="fc-txt b-amber-l-t" x="420" y="460">Approved</text>

          <!-- MERGE both branches back to Create ERP Masters -->
          <path class="l-green" d="M 140 360 L 140 505 L 280 505"/>
          <path class="l-amber" d="M 420 480 L 420 505 L 280 505"/>
          <circle cx="280" cy="505" r="5" fill="#6BE08A"/>
          <text class="merge-lbl" x="280" y="495">MERGE</text>
          <line class="l-green" x1="280" y1="510" x2="280" y2="528" marker-end="url(#arr-g)"/>

          <!-- ERP master + load PO + success -->
          <rect class="b-green-l" x="180" y="530" width="200" height="40" rx="8"/>
          <text class="fc-txt b-green-l-t" x="280" y="550">Create ERP Masters</text>
          <line class="l-green" x1="280" y1="570" x2="280" y2="588" marker-end="url(#arr-g)"/>

          <rect class="b-green-l" x="180" y="590" width="200" height="40" rx="8"/>
          <text class="fc-txt b-green-l-t" x="280" y="610">Load Purchase Order</text>
          <line class="l-green" x1="280" y1="630" x2="280" y2="648" marker-end="url(#arr-g)"/>

          <rect class="b-green" x="150" y="650" width="260" height="52" rx="8"/>
          <text class="fc-txt b-green-t" x="280" y="676">Success Notification Sent to User</text>
        </svg>
      </div>
    `
  },
];

/* Sub-step progress map: nodeIndex -> [slideIndex, ...] */
const nodeSubsteps = {};
slides.forEach((s,i)=>{ if(!nodeSubsteps[s.node]) nodeSubsteps[s.node]=[]; nodeSubsteps[s.node].push(i); });

const NODE_LABELS = ["Email\nreceived","Auto\nclassified","Attachments\nverified","Documents\ndownloaded","OCR\nextraction","AI Agents\nVerify","Business\nvalidation","Outcome"];
const NODE_COUNT = NODE_LABELS.length;

/* ---------------- BUILD PIPELINE NODES ---------------- */
const svgNS = "http://www.w3.org/2000/svg";
const nodesGroup = document.getElementById("nodesGroup");
const startX = 40, endX = 1140, y = 45;
const positions = [];
for(let i=0;i<NODE_COUNT;i++){
  const x = startX + (endX-startX) * (i/(NODE_COUNT-1));
  positions.push(x);
  const g = document.createElementNS(svgNS,"g");
  g.classList.add("node");
  g.dataset.index = i;

  const circle = document.createElementNS(svgNS,"circle");
  circle.setAttribute("cx", x); circle.setAttribute("cy", y); circle.setAttribute("r", 20);
  circle.classList.add("ring");
  g.appendChild(circle);

  const arc = document.createElementNS(svgNS,"circle");
  arc.setAttribute("cx", x); arc.setAttribute("cy", y); arc.setAttribute("r", 26);
  arc.setAttribute("transform", `rotate(-90, ${x}, ${y})`);
  arc.classList.add("prog-arc");
  const _ac = +(2 * Math.PI * 26).toFixed(3);
  arc.style.strokeDasharray = _ac;
  arc.style.strokeDashoffset = _ac;
  g.appendChild(arc);

  const num = document.createElementNS(svgNS,"text");
  num.setAttribute("x", x); num.setAttribute("y", y);
  num.classList.add("num");
  num.textContent = i+1;
  g.appendChild(num);

  const lines = NODE_LABELS[i].split("\n");
  lines.forEach((line, li)=>{
    const label = document.createElementNS(svgNS,"text");
    label.setAttribute("x", x);
    label.setAttribute("y", y + 38 + li*13);
    label.classList.add("label");
    label.textContent = line;
    g.appendChild(label);
  });

  nodesGroup.appendChild(g);
}

const trackFill = document.getElementById("trackFill");
const trackLen = endX - startX;
trackFill.style.strokeDasharray = trackLen;
trackFill.style.strokeDashoffset = trackLen;
const particle = document.getElementById("particle");

/* ---------------- CONTENT SLIDES ---------------- */
const contentWrap = document.getElementById("contentWrap");
slides.forEach((s, i)=>{
  const div = document.createElement("div");
  div.className = "slide" + (s.html.includes("shot-frame") ? " has-img" : "");
  div.id = "slide-"+i;
  div.innerHTML = `<div class="tag ${s.tagClass}">${s.tag}</div>` + s.html;
  contentWrap.appendChild(div);
});

/* ---------------- CONTROLS ---------------- */
const barsWrap = document.getElementById("bars");
slides.forEach((s,i)=>{
  const wrap = document.createElement("div");
  wrap.className = "bar-wrap";
  wrap.dataset.index = i;
  wrap.innerHTML = `<div class="bar"><span></span><\/div>`;
  wrap.addEventListener("click", ()=> goTo(i, true));
  barsWrap.appendChild(wrap);
});
const barEls = [...barsWrap.children];
const counterEl = document.getElementById("counter");
const playBtn = document.getElementById("playBtn");
const playIcon = document.getElementById("playIcon");
const pauseIcon = document.getElementById("pauseIcon");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

let current = -1;
let playing = true;
let rafId = null;
let segStart = 0;
const DURATION = 5200; // ms per slide

function setNodeStates(idx){
  const s = slides[idx];
  const activeNode = s.node;
  document.querySelectorAll(".node").forEach(n=>{
    const ni = +n.dataset.index;
    n.classList.remove("active","done","branch-fail");
    if(ni < activeNode) n.classList.add("done");
    else if(ni === activeNode){
      n.classList.add("active");
      if(s.branch) n.classList.add("branch-fail");
    }
  });
  // fill line up to node
  const progressX = activeNode <= 0 ? 0 : (positions[activeNode] - startX);
  trackFill.style.strokeDashoffset = trackLen - progressX;
  if(s.branch){ trackFill.style.stroke = "var(--amber)"; trackFill.style.filter="drop-shadow(0 0 6px rgba(255,180,84,.7))";}
  else { trackFill.style.stroke = "var(--teal)"; trackFill.style.filter="drop-shadow(0 0 6px rgba(79,224,200,.7))";}

  // particle travel
  particle.style.opacity = 1;
  particle.style.transition = "cx 1s ease";
  particle.setAttribute("cy", y);
  requestAnimationFrame(()=>{
    particle.setAttribute("cx", startX + progressX);
  });

  // Sub-step arc on the active node + dynamic outcome counter
  const _arcC = 2 * Math.PI * 26;
  document.querySelectorAll(".prog-arc").forEach(a=>{ a.style.opacity=0; a.style.strokeDashoffset=_arcC; });
  // Reset all node numbers to their default
  document.querySelectorAll(".node").forEach(n=>{
    const ni = +n.dataset.index;
    const numEl = n.querySelector("text.num");
    if(numEl) numEl.textContent = ni + 1;
  });
  const subSlides = nodeSubsteps[activeNode];
  if(subSlides && subSlides.length > 1){
    const subIdx = subSlides.indexOf(idx);
    const frac = (subIdx + 1) / subSlides.length;
    const arcEl = document.querySelector(`.node[data-index="${activeNode}"] .prog-arc`);
    if(arcEl){ arcEl.style.opacity=1; arcEl.style.strokeDashoffset = _arcC * (1 - frac); }
    // Show live outcome counter, e.g. "1/6", "2/6" ... on the active node
    const numEl = document.querySelector(`.node[data-index="${activeNode}"] text.num`);
    if(numEl) numEl.textContent = (subIdx + 1) + "/" + subSlides.length;
  }
}

function goTo(idx, manual){
  if(idx < 0) idx = 0;
  if(idx >= slides.length) idx = slides.length-1;
  if(idx === current) return;
  current = idx;

  document.querySelectorAll(".slide").forEach(el=>el.classList.remove("show"));
  document.getElementById("slide-"+idx).classList.add("show");

  setNodeStates(idx);

  barEls.forEach((b,i)=>{
    b.classList.remove("past","current");
    b.querySelector("span").style.transition = "none";
    b.querySelector("span").style.width = i < idx ? "100%" : "0%";
    if(i < idx) b.classList.add("past");
    if(i === idx) b.classList.add("current");
  });

  counterEl.textContent = (idx+1) + "/" + slides.length;
  segStart = performance.now();
  if(manual){ /* reset autoplay timer but keep playing state */ }
}

function tick(now){
  if(playing && current >= 0){
    const elapsed = now - segStart;
    const pct = Math.min(elapsed / DURATION, 1);
    const activeBar = barEls[current].querySelector("span");
    activeBar.style.transition = "none";
    activeBar.style.width = (pct*100) + "%";
    if(pct >= 1){
      if(current < slides.length - 1){
        goTo(current+1);
      } else {
        playing = false;
        updatePlayIcon();
      }
    }
  }
  rafId = requestAnimationFrame(tick);
}

function updatePlayIcon(){
  playIcon.style.display = playing ? "none" : "block";
  pauseIcon.style.display = playing ? "block" : "none";
}

playBtn.addEventListener("click", ()=>{
  if(!playing && current === slides.length-1){
    goTo(0);
  }
  playing = !playing;
  segStart = performance.now();
  updatePlayIcon();
});
prevBtn.addEventListener("click", ()=>{ playing=false; updatePlayIcon(); goTo(current-1, true); });
nextBtn.addEventListener("click", ()=>{ playing=false; updatePlayIcon(); goTo(Math.min(current+1, slides.length-1), true); });

document.addEventListener("keydown", (e)=>{
  if(e.key === "ArrowRight"){ playing=false; updatePlayIcon(); goTo(Math.min(current+1, slides.length-1), true); }
  if(e.key === "ArrowLeft"){ playing=false; updatePlayIcon(); goTo(Math.max(current-1,0), true); }
  if(e.key === " "){ e.preventDefault(); playBtn.click(); }
});

goTo(0);
updatePlayIcon();
rafId = requestAnimationFrame(tick);

/* ---------- LIGHTBOX ---------- */
const lbOverlay = document.getElementById('lb-overlay');
const lbImg     = document.getElementById('lb-img');
const lbClose   = document.getElementById('lb-close');
const lbZoom    = document.getElementById('lb-zoom');
const lbStage   = document.getElementById('lb-stage');

function setZoom(on){
  lbOverlay.classList.toggle('zoomed', on);
  lbZoom.textContent = on ? 'Fit' : 'Zoom 150%';
  if(on){
    // center horizontally after zoom kicks in
    requestAnimationFrame(()=>{
      lbOverlay.scrollLeft = (lbOverlay.scrollWidth - lbOverlay.clientWidth) / 2;
    });
  } else {
    lbOverlay.scrollTop = 0;
    lbOverlay.scrollLeft = 0;
  }
}
function openLightbox(src, alt){
  lbImg.src = src;
  lbImg.alt = alt || '';
  setZoom(false);
  lbOverlay.classList.add('open');
  playing = false; updatePlayIcon();
}
function closeLightbox(){
  lbOverlay.classList.remove('open');
  setZoom(false);
  setTimeout(()=>{ lbImg.src=''; }, 220);
}

document.addEventListener('click', e=>{
  const img = e.target.closest('.shot-frame img');
  if(img){ e.stopPropagation(); openLightbox(img.src, img.alt); return; }
  const svg = e.target.closest('.shot-frame svg');
  if(svg){
    e.stopPropagation();
    // serialize SVG to a data URL and open in lightbox
    const clone = svg.cloneNode(true);
    // ensure width/height so it renders when rasterized by browser
    if(!clone.getAttribute('width'))  clone.setAttribute('width',  clone.viewBox.baseVal.width  || 800);
    if(!clone.getAttribute('height')) clone.setAttribute('height', clone.viewBox.baseVal.height || 800);
    const xml = new XMLSerializer().serializeToString(clone);
    const src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
    openLightbox(src, 'Workflow diagram');
  }
});
lbImg.addEventListener('click', e=>{
  e.stopPropagation();
  setZoom(!lbOverlay.classList.contains('zoomed'));
});
lbZoom.addEventListener('click', e=>{
  e.stopPropagation();
  setZoom(!lbOverlay.classList.contains('zoomed'));
});
lbClose.addEventListener('click', e=>{ e.stopPropagation(); closeLightbox(); });
lbOverlay.addEventListener('click', e=>{
  // click on empty overlay area closes; click on image / controls doesn't
  if(e.target === lbOverlay || e.target === lbStage) closeLightbox();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && lbOverlay.classList.contains('open')) closeLightbox(); });
</script>
</body>
